<!DOCTYPE html>
<html lang="bh">
  <head>
    <meta charset="UTF-8" />
    <title>Zadatak 4 - Bodovanje po predmetima</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <table>
      <caption>
        Bodovanje po predmetima
      </caption>
      <thead>
        <tr>
          <th>Predmet</th>
          <th>Ispiti</th>
          <th>Zadaće</th>
          <th>Prisustvo</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>PNWT</td>
          <td>20</td>
          <td>10</td>
          <td>10</td>
        </tr>
        <tr>
          <td>MMS</td>
          <td>20</td>
          <td colspan="2">30</td>
        </tr>
        <tr>
          <td rowspan="2">SI</td>
          <td>20/2</td>
          <td>10</td>
          <td>10</td>
        </tr>
        <tr>
          <td>20</td>
          <td colspan="2">?</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
